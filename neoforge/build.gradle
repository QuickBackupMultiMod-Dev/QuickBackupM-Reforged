plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    mavenLocal()
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ":${mod_id}-common")) { transitive false }
    shadowBundle project(path: ":${mod_id}-common", configuration: "transformProductionNeoForge")

    forgeRuntimeLibrary("org.quartz-scheduler:quartz:2.5.0")
    include("org.quartz-scheduler:quartz:2.5.0")

    // Kotlin for NeoForge (Fabric uses fabric-language-kotlin instead).
    include("org.jetbrains.kotlin:kotlin-stdlib:2.1.0")
}

processResources {
    def minecraftRange = minecraftNeoForgeRange(project.minecraft_supported_versions)

    inputs.property "version", project.version
    inputs.property "minecraft_range", minecraftRange

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version, minecraft_range: minecraftRange
    }
}

// Thin jar (platform-only + loom includes). Release artifact is shadowJar below.
jar {
    archiveClassifier = "dev"
}

// Final mod jar: platform jar contents + transformed common classes + relocated libs.
shadowJar {
    dependsOn(jar)
    from(zipTree(tasks.named("jar", Jar).flatMap { it.archiveFile }))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ""
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from rootProject.file("LICENSE.md")
}

tasks.named("assemble").configure {
    dependsOn(tasks.named("shadowJar"))
}

apply from: rootProject.file("gradle/embed-libs.gradle")
