plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    mavenLocal()
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ":${mod_id}-common")) { transitive false }
    shadowBundle project(path: ":${mod_id}-common", configuration: "transformProductionNeoForge")

    forgeRuntimeLibrary("org.quartz-scheduler:quartz:2.5.0")
    include(group: "org.quartz-scheduler", name: "quartz", version: "2.5.0") {
        exclude group: "org.slf4j"
    }

    // Kotlin for NeoForge (Fabric uses fabric-language-kotlin instead).
    include("org.jetbrains.kotlin:kotlin-stdlib:2.1.0")
}

processResources {
    def minecraftRange = minecraftNeoForgeRange(project.minecraft_supported_versions)

    inputs.property "version", project.version
    inputs.property "minecraft_range", minecraftRange

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version, minecraft_range: minecraftRange
    }
}

// Intermediate: transformed common classes + relocated/embedded libs.
// `configurations` and the relocations are set by gradle/embed-libs.gradle.
shadowJar {
    archiveClassifier = "dev-shadow"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Release artifact. loom-no-remap attaches its NestJarsAction and
// ManifestModificationAction as doLast actions on `jar`, so `jar` has to be the
// outermost archive; packaging the release from shadowJar instead drops the nested
// jar declarations and Loom's manifest attributes.
jar {
    dependsOn(tasks.named("shadowJar"))
    from(zipTree(tasks.named("shadowJar", Jar).flatMap { it.archiveFile }))
    from rootProject.file("LICENSE.txt")
    archiveClassifier = ""
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // H2 ships META-INF/versions/{9,10,21}; shadowJar's manifest used to provide this.
    manifest {
        attributes("Multi-Release": "true")
    }
}

apply from: rootProject.file("gradle/embed-libs.gradle")
apply from: rootProject.file("gradle/verify-mod-jar.gradle")
