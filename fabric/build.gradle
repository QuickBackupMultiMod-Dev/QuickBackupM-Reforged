plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc:fabric-language-kotlin:1.13.0+kotlin.2.1.0"

    Set<String> apiModules = [
            "fabric-command-api-v2",
            "fabric-lifecycle-events-v1",
    ]

    apiModules.forEach {
        include(implementation(fabricApi.module(it, rootProject.fabric_api_version)))
    }

    common(project(path: ":${mod_id}-common:")) { transitive false }
    shadowBundle project(path: ":${mod_id}-common", configuration: "transformProductionFabric")

    // Quartz stays JiJ. Exposed/H2/storage-lib are relocated via embed-libs.
    include(group: "org.quartz-scheduler", name: "quartz", version: "2.5.0") {
        exclude group: "org.slf4j"
    }
}

processResources {
    def minecraftRange = minecraftFabricRange(project.minecraft_supported_versions)

    inputs.property "version", project.version
    inputs.property "minecraft_range", minecraftRange

    filesMatching("fabric.mod.json") {
        expand version: project.version, minecraft_range: minecraftRange
    }
}

// Intermediate: transformed common classes + relocated/embedded libs.
// `configurations` and the relocations are set by gradle/embed-libs.gradle.
shadowJar {
    archiveClassifier = "dev-shadow"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Release artifact. loom-no-remap attaches its NestJarsAction and
// ManifestModificationAction as doLast actions on `jar`, so `jar` has to be the
// outermost archive; packaging the release from shadowJar instead drops the nested
// jar declarations in fabric.mod.json and Loom's manifest attributes, which is what
// caused NoClassDefFoundError: org/quartz/* in 3.3.x.
jar {
    dependsOn(tasks.named("shadowJar"))
    from(zipTree(tasks.named("shadowJar", Jar).flatMap { it.archiveFile }))
    from rootProject.file("LICENSE.txt")
    archiveClassifier = ""
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // H2 ships META-INF/versions/{9,10,21}; shadowJar's manifest used to provide this.
    manifest {
        attributes("Multi-Release": "true")
    }
}

apply from: rootProject.file("gradle/embed-libs.gradle")
apply from: rootProject.file("gradle/verify-mod-jar.gradle")
