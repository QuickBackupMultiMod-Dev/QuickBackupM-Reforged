plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    Set<String> apiModules = [
            "fabric-command-api-v2",
            "fabric-lifecycle-events-v1",
    ]

    apiModules.forEach {
        include(modImplementation(fabricApi.module(it, rootProject.fabric_api_version)))
    }

    common(project(path: ":${mod_id}-common:", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":${mod_id}-common", configuration: "transformProductionFabric")

    modImplementation("net.fabricmc:fabric-language-kotlin:1.12.3+kotlin.2.0.21")

    // Quartz is uncommon as a shared JiJ; keep nested, but do not bundle its SLF4J API.
    include(group: "org.quartz-scheduler", name: "quartz", version: "2.5.0") {
        exclude group: "org.slf4j"
    }
}

processResources {
    def minecraftRange = minecraftFabricRange(project.minecraft_supported_versions)

    inputs.property "version", project.version
    inputs.property "minecraft_range", minecraftRange

    filesMatching("fabric.mod.json") {
        expand version: project.version, minecraft_range: minecraftRange
    }
}

shadowJar {
    archiveClassifier = "dev-shadow"
}

apply from: rootProject.file("gradle/embed-libs.gradle")

remapJar {
    input.set shadowJar.archiveFile
}
