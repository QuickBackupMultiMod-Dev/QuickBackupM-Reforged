name: Dev Builds

on:
  push:
    paths:
      - "*.gradle"
      # "*.gradle" only matches the root; the per-module build files live one level down.
      - "*/*.gradle"
      - "gradle.properties"
      - "*/src/**"
      - ".github/known-issues.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/gradle.yml"
      - ".github/workflows/scripts/**"

  pull_request:
    paths:
      - "*.gradle"
      - "*/*.gradle"
      - "gradle.properties"
      - "*/src/**"
      - ".github/known-issues.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/gradle.yml"
      - ".github/workflows/scripts/**"


jobs:
  build:
    uses: ./.github/workflows/build.yml