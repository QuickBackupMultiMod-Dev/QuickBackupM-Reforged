name: build
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        description: ''
        default: false
      tag:
        type: string
        required: false
      ref:
        type: string
        required: false
        description: Git ref/branch to checkout; empty uses the triggering ref
        default: ''
      artifact_name:
        type: string
        required: false
        description: Upload artifact name
        default: 'build-artifacts'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Check out (triggering ref)
        if: ${{ inputs.ref == '' }}
        uses: actions/checkout@v4

      - name: Check out (specified ref)
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve CI Java / build task
        id: ci_meta
        run: |
          JAVA=$(grep -E '^[[:space:]]*ci_java_version[[:space:]]*=' gradle.properties | tail -1 | cut -d= -f2- | tr -d ' \r' || true)
          TASK=$(grep -E '^[[:space:]]*ci_build_task[[:space:]]*=' gradle.properties | tail -1 | cut -d= -f2- | tr -d ' \r' || true)
          MOD_ID=$(grep -E '^[[:space:]]*mod_id[[:space:]]*=' gradle.properties | tail -1 | cut -d= -f2- | tr -d ' \r' || true)
          echo "java=${JAVA:-21}" >> "$GITHUB_OUTPUT"
          echo "task=${TASK:-remapJar}" >> "$GITHUB_OUTPUT"
          if [ -d harness ] && [ -n "$MOD_ID" ]; then
            echo "harness_project=${MOD_ID}-harness" >> "$GITHUB_OUTPUT"
          else
            echo "harness_project=" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved ci_java_version=${JAVA:-21} ci_build_task=${TASK:-remapJar} harness=${MOD_ID:-none}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.ci_meta.outputs.java }}
          distribution: 'temurin'

      - name: Cache gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ inputs.ref || github.ref_name }}-${{ hashFiles('*.gradle', 'gradle.properties', '**/*.accesswidener') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Fast unit tests
        if: ${{ steps.ci_meta.outputs.harness_project != '' }}
        run: ./gradlew :${{ steps.ci_meta.outputs.harness_project }}:test --no-daemon

      - name: Build with Gradle
        run: ./gradlew ${{ steps.ci_meta.outputs.task }} --no-daemon
        env:
          BUILD_TAG: ${{ inputs.tag }}
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ./*/build/libs/
            !./*/build/libs/*shadow*.jar
            !./*/build/libs/*source*.jar
            !./common/build/libs/
            !./cli/build/libs/

  summary:
    runs-on: ubuntu-22.04
    needs:
      - build

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build-artifacts

      - name: Make build summary
        run: python3 .github/workflows/scripts/summary.py
