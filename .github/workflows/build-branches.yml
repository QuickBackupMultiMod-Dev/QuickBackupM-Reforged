name: build-branches
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      tag:
        type: string
        required: false
      branch_matrix:
        type: string
        required: true
        description: JSON matrix object with include entries (branch, java, build_task)

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.branch_matrix) }}

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Resolve CI Java / build task
        id: ci_meta
        run: |
          # Prefer values from the checked-out branch; fall back to matrix / defaults.
          JAVA=$(grep -E '^[[:space:]]*ci_java_version[[:space:]]*=' gradle.properties | tail -1 | cut -d= -f2- | tr -d ' \r' || true)
          TASK=$(grep -E '^[[:space:]]*ci_build_task[[:space:]]*=' gradle.properties | tail -1 | cut -d= -f2- | tr -d ' \r' || true)
          if [ -z "$JAVA" ]; then JAVA='${{ matrix.java }}'; fi
          if [ -z "$TASK" ]; then TASK='${{ matrix.build_task }}'; fi
          echo "java=${JAVA:-21}" >> "$GITHUB_OUTPUT"
          echo "task=${TASK:-remapJar}" >> "$GITHUB_OUTPUT"
          echo "Branch ${{ matrix.branch }} -> java=${JAVA:-21} task=${TASK:-remapJar}"
          java -version || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.ci_meta.outputs.java }}
          distribution: 'temurin'

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Cache gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ matrix.branch }}-${{ hashFiles('*.gradle', 'gradle.properties', '**/*.accesswidener') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.branch }}-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew ${{ steps.ci_meta.outputs.task }} --no-daemon
        env:
          BUILD_TAG: ${{ inputs.tag }}
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.branch }}
          path: |
            ./*/build/libs/
            !./*/build/libs/*-dev.jar
            !./*/build/libs/*shadow*.jar
            !./*/build/libs/*source*.jar
            !./common/build/libs/
            !./cli/build/libs/

  summary:
    runs-on: ubuntu-22.04
    needs:
      - build
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          path: build-artifacts
          merge-multiple: true

      - name: Make build summary
        run: python3 .github/workflows/scripts/summary.py
