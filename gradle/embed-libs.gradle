// Embeds database libraries into the mod jar and relocates their packages so they
// cannot clash with other mods that JiJ the same libraries (notably Ledger + Exposed).
//
// Applied from fabric/neoforge after their shadowBundle configuration exists.

configurations {
    embed {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    def embedLib = { Object notation ->
        embed(notation) {
            // Kotlin is provided by fabric-language-kotlin (Fabric) or kotlin-stdlib JiJ (NeoForge).
            exclude group: 'org.jetbrains.kotlin'
            exclude group: 'org.jetbrains.kotlinx'
            // SLF4J is provided by the mod loader/runtime; do not bundle it into the mod jar.
            exclude group: 'org.slf4j'
        }
    }

    embedLib("io.github.skydynamic:incremental-storage-lib:$rootProject.incremental_storage_lib_version")
    embedLib("org.jetbrains.exposed:exposed-core:0.57.0")
    embedLib("org.jetbrains.exposed:exposed-jdbc:0.57.0")
    embedLib("com.h2database:h2:2.2.224")
}

tasks.named("shadowJar").configure {
    configurations = [
        project.configurations.shadowBundle,
        project.configurations.embed,
    ]
    mergeServiceFiles()

    // Unique package prefix so Fabric/NeoForge classloaders never see Ledger's Exposed.
    relocate(
        'org.jetbrains.exposed',
        'io.github.skydynamic.quickbackupmulti.repack.org.jetbrains.exposed'
    )
    // H2 cannot be relocated: MVStore persists DataType Class.getName() into .mv.db
    // and later Class.forName()s that exact string. Keep the original org.h2 package.
}
