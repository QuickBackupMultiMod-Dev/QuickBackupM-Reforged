apply plugin: "java"

base.archivesName = project.archives_name + "-cli"

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name "CjsahMaven"
        url "https://server.cjsah.net:1002/maven/"
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    // Same pure-Java backup/storage stack the mod uses — no Minecraft.
    shade("io.github.skydynamic:incremental-storage-lib:$rootProject.incremental_storage_lib_version")
    shade("org.jetbrains.exposed:exposed-core:0.57.0")
    shade("org.jetbrains.exposed:exposed-jdbc:0.57.0")
    shade("com.h2database:h2:2.2.224")

    shade("com.google.code.gson:gson:2.11.0")
    shade("commons-io:commons-io:2.16.1")

    // SLF4J binding so library log messages (and errors) are actually printed instead of the "no providers" notice.
    shade("org.slf4j:slf4j-simple:2.0.13")

    // CLI argument parsing
    shade("info.picocli:picocli:4.7.6")
    annotationProcessor("info.picocli:picocli-codegen:4.7.6")

    // Interactive terminal UI (raw-mode key reading + cursor control) for the arrow-key/WASD menus.
    // Works across cmd.exe, PowerShell and Windows Terminal without any hand-rolled Win32 console code.
    shade("org.jline:jline:3.30.0")
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes("Main-Class": "io.github.skydynamic.quickbackupmulti.cli.QbmCli")
    }
}
